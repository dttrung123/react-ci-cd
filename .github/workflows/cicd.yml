name: CI/CD Microservices

on:
  push:
    branches:
      - dev # Thay đổi nếu bạn dùng branch khác

jobs:
  build-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Build and push backend Docker image
        run: |
          docker build -t dttrung324/my-shop-backend:latest ./backend
          docker login -u ${{ secrets.DOCKERHUB_USERNAME }} -p ${{ secrets.DOCKERHUB_TOKEN }}
          docker push dttrung324/my-shop-backend:latest

