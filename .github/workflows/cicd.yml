name: CI/CD Microservices

on:
  push:
    branches:
      - dev

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v2
      - name: Login to Docker Hub
        run: docker login -u ${{ secrets.DOCKERHUB_USERNAME }} -p ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build Docker Image
        run: docker build -t dttrung324/my-shop-frontend:latest ./frontend
      - name: Publish image to docker hub
        run: docker push dttrung324/my-shop-frontend:latest ./frontend 

  deploy: 
    needs: build
    runs-on: aws-ec2    
    steps:
      - name: Pull image from docker hub
        run: docker pull dttrung324/my-shop-frontend:latest ./frontend
      - name: Delete Old Container
        run: docker rm -f my-shop-frontend
      - name: Run docker container
        run: docker run -d -p 3000:80 --name my-shop-frontend dttrung324/my-shop-frontend