name: CI/CD Microservices

on:
  push:
    branches:
      - main # Thay đổi nếu bạn dùng branch khác

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Build and push backend Docker image
        run: |
          docker build -t your-dockerhub-username/backend:latest ./backend
          docker login -u ${{ secrets.DOCKERHUB_USERNAME }} -p ${{ secrets.DOCKERHUB_TOKEN }}
          docker push your-dockerhub-username/backend:latest

      - name: Build and push frontend Docker image
        run: |
          docker build -t your-dockerhub-username/frontend:latest ./frontend
          docker push your-dockerhub-username/frontend:latest

      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          script: |
            docker login -u ${{ secrets.DOCKERHUB_USERNAME }} -p ${{ secrets.DOCKERHUB_TOKEN }}
            docker pull your-dockerhub-username/backend:latest
            docker pull your-dockerhub-username/frontend:latest
            docker stop backend-container || true
            docker stop frontend-container || true
            docker rm backend-container || true
            docker rm frontend-container || true
            docker run -d -p 3000:3000 --name backend-container your-dockerhub-username/backend:latest
            docker run -d -p 80:80 --name frontend-container your-dockerhub-username/frontend:latest